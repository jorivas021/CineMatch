<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinéMatch - Catalogue de Films</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="brand">
      <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
        <line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/>
        <line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/>
        <line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/>
        <line x1="17" y1="7" x2="22" y2="7"/>
      </svg>
      <h1 class="logo-text">Ciné<span class="highlight">Match</span></h1>
    </div>

    <!-- Barre de recherche -->
    <form id="search-form" class="search-container">
      <input type="text" id="search-input" placeholder="Rechercher un film...">
      <button type="submit" aria-label="Rechercher">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>

    <!-- Navigation Onglets (Populaires / Favoris) -->
    <nav class="nav-tabs">
      <button id="tab-popular" class="tab-btn active">Tendances</button>
      <button id="tab-favorites" class="tab-btn">Mes Favoris ❤️ (<span id="fav-count">0</span>)</button>
    </nav>
  </header>

  <!-- Conteneur Principal -->
  <main class="main-content">
    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p>Chargement des films...</p>
    </div>
    <div id="error-message" class="error-message hidden"></div>
    
    <h2 id="section-title" class="section-title">Films Populaires</h2>
    <div id="movies-grid" class="movies-grid"></div>
  </main>

  <!-- Modale Détails Film (Niveau 3) -->
  <div id="movie-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal-btn" class="close-modal">&times;</button>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Overlay de la modale -->
  <div id="overlay" class="overlay hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
